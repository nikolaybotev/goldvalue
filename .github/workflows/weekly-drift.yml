name: weekly-drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    # Non-blocking by design: live sources can change or go down independently of this repo.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compare live source shapes with the synthetic fixture
        run: python tools/snapshot/check_drift.py
      - name: Live end-to-end smoke test (80000 / 2018-12 = 63,979.53 GB)
        run: |
          python -m pip install pytest
          python -m pytest tests/python -q -m network
