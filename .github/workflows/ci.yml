name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check (standard library only)
        run: python -m compileall -q .agents/skills/gold-value-normalizer/scripts
      - name: Install pytest
        run: python -m pip install pytest
      - name: pytest
        run: python -m pytest tests/python -q
      - name: Vector determinism (regenerate fixture, vectors, batch outputs; expect no diff)
        run: |
          python test-vectors/regenerate.py
          git status --porcelain -- test-vectors | tee /tmp/vector-diff
          test ! -s /tmp/vector-diff

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Initial-load budget (NFR1; synthetic monthly.csv stands in for the real one)
        run: |
          python3 tools/snapshot/sync_data.py --source-dir test-vectors/snapshot --out apps/web/dist/data
          node scripts/check-size.mjs --require-data

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @goldvalue/web exec playwright install --with-deps chromium
      - name: Playwright (vite preview, stubbed LBMA)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lighthouse CI (mobile, median of 3, performance >= 90; LBMA served from the synthetic fixture)
        run: pnpm lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/report
          if-no-files-found: ignore
